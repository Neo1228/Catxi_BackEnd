---
- name: Deploy Catxi Monitoring Stack to GCP Management Server
  hosts: gcp_role_monitoring
  become: yes
  vars:
    monitoring_dir: "/opt/catxi-monitoring"

  tasks:
    - name: Create monitoring directory
      file:
        path: "{{ monitoring_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create subdirectories for monitoring components
      file:
        path: "{{ monitoring_dir }}/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - prometheus/data
        - grafana/data
        - grafana/provisioning/datasources
        - grafana/provisioning/dashboards
        - grafana/dashboards
        - alertmanager
        - loki
        - promtail

    - name: Note about Docker volumes
      debug:
        msg: "Using Docker named volumes for data persistence - no manual permission setting needed"

    - name: Copy docker-compose.yml
      copy:
        src: ../monitoring/docker-compose.yml
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Create Prometheus configuration with dynamic targets
      template:
        src: prometheus.yml.j2
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy Prometheus alert rules
      copy:
        src: ../monitoring/prometheus/alerts/
        dest: "{{ monitoring_dir }}/prometheus/alerts/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy Grafana datasources provisioning
      copy:
        src: ../monitoring/grafana/provisioning/datasources/
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy Grafana dashboards provisioning
      copy:
        src: ../monitoring/grafana/provisioning/dashboards/
        dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy Grafana dashboards
      copy:
        src: ../monitoring/grafana/dashboards/
        dest: "{{ monitoring_dir }}/grafana/dashboards/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Create AlertManager configuration from template
      template:
        src: alertmanager.yml.j2
        dest: "{{ monitoring_dir }}/alertmanager/alertmanager.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy Loki configuration
      copy:
        src: ../monitoring/loki/loki.yml
        dest: "{{ monitoring_dir }}/loki/loki.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Copy Promtail configuration
      copy:
        src: ../monitoring/promtail/promtail.yml
        dest: "{{ monitoring_dir }}/promtail/promtail.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Create environment file from variables
      template:
        src: monitoring.env.j2
        dest: "{{ monitoring_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Create external catxi-logs Docker volume
      community.docker.docker_volume:
        name: catxi-logs
        state: present

    - name: Stop existing monitoring containers
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: absent
      ignore_errors: yes

    - name: Pull latest Docker images
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        pull: always

    - name: Deploy monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: present
        recreate: always

    - name: Wait for Grafana to be ready
      wait_for:
        port: 3000
        host: "localhost"
        timeout: 120
        delay: 10

    - name: Wait for Prometheus to be ready
      wait_for:
        port: 9090
        host: "localhost"
        timeout: 120
        delay: 10

    - name: Wait for AlertManager to be ready
      wait_for:
        port: 9093
        host: "localhost"
        timeout: 60
        delay: 5

    - name: Wait for Loki to be ready
      wait_for:
        port: 3100
        host: "localhost"
        timeout: 60
        delay: 5

    - name: Check container health
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: present
      register: container_status

    - name: Display container status
      debug:
        var: container_status.stdout_lines

    - name: Verify Prometheus targets
      ansible.builtin.uri:
        url: "http://localhost:9090/api/v1/targets?state=active"
        method: GET
        status_code: 200
        return_content: true
      register: prometheus_targets
      changed_when: false
      retries: 24
      delay: 5
      until:
        - prometheus_targets.status == 200
        - prometheus_targets.json.status | default('') == 'success'
        - >-
          (prometheus_targets.json.data.activeTargets | default([])
          | selectattr('labels.job', 'equalto', 'catxi-backend-instances')
          | list | length) == 2
        - >-
          (prometheus_targets.json.data.activeTargets | default([])
          | selectattr('labels.job', 'equalto', 'catxi-backend-instances')
          | selectattr('health', 'equalto', 'up')
          | list | length) == 2
        - >-
          (prometheus_targets.json.data.activeTargets | default([])
          | selectattr('labels.job', 'equalto', 'node-exporter')
          | list | length) == 1
        - >-
          (prometheus_targets.json.data.activeTargets | default([])
          | selectattr('labels.job', 'equalto', 'node-exporter')
          | selectattr('health', 'equalto', 'up')
          | list | length) == 1

    - name: Display monitoring deployment result
      debug:
        msg:
          - "Monitoring stack deployed on {{ ansible_host }}."
          - "Two backend targets and one monitoring host target are healthy."